apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-service.fullname" . }}
  labels: {{- include "user-service.labels" . | nindent 4 }}
spec:
  {{- /* NodePort is what a floci ALB target group registers as its target; a pod IP
         is unreachable from sibling containers. ClusterIP stays the default. */}}
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector: {{- include "user-service.selectorLabels" . | nindent 4 }}
