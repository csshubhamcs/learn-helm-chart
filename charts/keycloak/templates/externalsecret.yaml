apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecret.storeName }}, kind: ClusterSecretStore }
  target: { name: keycloak-secrets, creationPolicy: Owner }
  data:
    {{- $p := required "secretPrefix is required — without it this environment would read another environment's secrets" .Values.secretPrefix }}
    - { secretKey: KC_DB_PASSWORD,              remoteRef: { key: "{{ $p }}/keycloak-db-password" } }
    - { secretKey: KC_BOOTSTRAP_ADMIN_USERNAME, remoteRef: { key: "{{ $p }}/keycloak-admin-username" } }
    - { secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD, remoteRef: { key: "{{ $p }}/keycloak-admin-password" } }
