{{- if .Values.bootstrap.enabled }}
{{- /*
Three things the realm import cannot do for itself. Without this Job, user
registration fails on the cluster while working fine in local docker-compose —
the worst kind of divergence, because you assume the cluster is broken.

  1. The user-service service account needs realm-management roles to create
     users through the Admin API. Keycloak 26 rejects an unrecognised
     serviceAccountClientRoles field on ClientRepresentation and aborts the
     whole --import-realm, so this cannot live in realm-export.json.
  2. Keycloak's declarative User Profile marks firstName/lastName required.
     Registration takes only email + password, and an unmet requirement
     silently attaches a VERIFY_PROFILE action that blocks first login with
     "Account is not fully set up" — and does not appear in requiredActions.
  3. UPDATE_EMAIL must be enabled for the self-service email-change flow.

Runs on every install and upgrade; every step is idempotent.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: learn-platform }
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak-bootstrap }
    spec:
      restartPolicy: OnFailure
      # must satisfy the `restricted` Pod Security Standard enforced on this namespace
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: "quay.io/keycloak/keycloak:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
          env:
            - name: KC_ADMIN
              valueFrom: { secretKeyRef: { name: keycloak-secrets, key: KC_BOOTSTRAP_ADMIN_USERNAME } }
            - name: KC_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC=/opt/keycloak/bin/kcadm.sh
              export JAVA_OPTS_APPEND="-Duser.home=/tmp"

              until "$KC" config credentials --server http://keycloak:8080 \
                    --realm master --user "$KC_ADMIN" --password "$KC_ADMIN_PASSWORD" 2>/dev/null; do
                echo "waiting for keycloak..."; sleep 5
              done

              "$KC" add-roles -r {{ .Values.realm | quote }} \
                --uusername service-account-user-service \
                --cclientid realm-management \
                --rolename manage-users --rolename view-users \
                --rolename query-users --rolename view-realm \
                || echo "roles already granted — continuing"

              "$KC" update users/profile -r {{ .Values.realm | quote }} -f /tmp/profile/user-profile.json \
                || echo "user profile update skipped — continuing"

              "$KC" update authentication/required-actions/UPDATE_EMAIL \
                -r {{ .Values.realm | quote }} -s enabled=true \
                || echo "UPDATE_EMAIL enable skipped — continuing"
              {{- if .Values.smtp.enabled }}

              # --import-realm SKIPS a realm that already exists, so SMTP settings edited in
              # realm-export.json after the first boot are never applied. Set them here instead,
              # where it works on both a fresh and an existing realm.
              "$KC" update realms/{{ .Values.realm }} \
                -s 'smtpServer.host={{ .Values.smtp.host }}' \
                -s 'smtpServer.port={{ .Values.smtp.port }}' \
                -s 'smtpServer.from={{ .Values.smtp.from }}' \
                -s 'smtpServer.fromDisplayName={{ .Values.smtp.fromDisplayName }}' \
                -s 'smtpServer.auth=true' \
                -s 'smtpServer.user={{ .Values.smtp.user }}' \
                -s 'smtpServer.ssl={{ .Values.smtp.ssl }}' \
                -s 'smtpServer.starttls={{ .Values.smtp.starttls }}' \
                -s 'smtpServer.timeout=10000' \
                -s 'smtpServer.connectionTimeout=10000' \
                -s 'smtpServer.writeTimeout=10000' \
                -s 'smtpServer.password=$${vault.smtp-password}'

              # A MISSING vault file does not error — Keycloak silently uses the literal
              # string "${vault.smtp-password}" as the password and every send fails with a
              # 535. Prove the file is there rather than assuming.
              echo "smtp configured. Verify the vault file exists inside the keycloak pod:"
              echo "  kubectl -n {{ .Release.Namespace }} exec sts/keycloak -- ls /opt/keycloak/vault"
              echo "  (expect: {{ .Values.realm }}_smtp-password)"
              {{- end }}
              echo "bootstrap complete"
          volumeMounts:
            - { name: profile, mountPath: /tmp/profile, readOnly: true }
            - { name: tmp, mountPath: /tmp/kc }
      volumes:
        - name: profile
          configMap: { name: {{ .Values.bootstrap.userProfileConfigMap }} }
        - name: tmp
          emptyDir: {}
{{- end }}
