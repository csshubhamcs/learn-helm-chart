apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: learn-platform }
spec:
  serviceName: keycloak-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                 # makes the emptyDirs writable by the keycloak user
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: keycloak }
      initContainers:
        # /opt/keycloak/lib/quarkus is NOT empty in the stock image — it ships the built
        # Quarkus application, including quarkus-application.dat, which kc.sh's own
        # launcher reads before it can do anything at all. Mounting an empty emptyDir
        # straight over that path hides those files and Keycloak exits 1 with
        # NoSuchFileException before it ever reaches the build step.
        #
        # But the path must ALSO be writable, because a non-optimized `start` rewrites
        # it. So: copy the image's contents into the volume first, then mount the volume
        # over the path. That keeps readOnlyRootFilesystem AND lets the build succeed.
        - name: seed-quarkus
          image: "quay.io/keycloak/keycloak:{{ .Values.image.tag }}"
          command: ["sh", "-c", "cp -a /opt/keycloak/lib/quarkus/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 128Mi }
          volumeMounts:
            - name: quarkus
              mountPath: /seed          # NOT the real path — that would mask the source
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:{{ .Values.image.tag }}"
          {{- if .Values.realmImport.enabled }}
          args: ["start", "--import-realm"]
          {{- else }}
          args: ["start"]
          {{- end }}
          {{- /* NOT --optimized: the stock image carries no pre-built postgres
                 augmentation, so Keycloak must run its build step on boot. */}}
          ports:
            - { name: http,       containerPort: 8080 }
            - { name: management, containerPort: 9000 }
            - { name: jgroups,    containerPort: 7800 }
          env:
            - { name: KC_DB,              value: postgres }
            - { name: KC_DB_URL,          value: {{ .Values.database.url | quote }} }
            - { name: KC_DB_USERNAME,     value: {{ .Values.database.username | quote }} }
            - { name: KC_HOSTNAME,        value: {{ .Values.hostname | quote }} }
            - { name: KC_HOSTNAME_STRICT, value: {{ .Values.hostnameStrict | default "false" | quote }} }
            - { name: KC_PROXY_HEADERS,   value: xforwarded }
            - { name: KC_HTTP_ENABLED,    value: "true" }
            - { name: KC_HEALTH_ENABLED,  value: "true" }
            {{- if .Values.smtp.enabled }}
            - { name: KC_VAULT,     value: file }
            - { name: KC_VAULT_DIR, value: /opt/keycloak/vault }
            {{- if .Values.smtp.debugLogging }}
            - name: KC_LOG_LEVEL
              value: "INFO,org.keycloak.services:DEBUG,org.keycloak.email:DEBUG,jakarta.mail:TRACE"
            {{- end }}
            {{- end }}
            - { name: KC_METRICS_ENABLED, value: "true" }
            {{- if gt (int .Values.replicaCount) 1 }}
            - { name: KC_CACHE,           value: ispn }
            - { name: KC_CACHE_STACK,     value: kubernetes }
            - name: JAVA_OPTS_APPEND
              value: "-Djgroups.dns.query=keycloak-headless.{{ .Release.Namespace }}.svc.cluster.local"
            {{- else }}
            - { name: KC_CACHE,           value: local }   # one replica: nothing to cluster with
            {{- end }}
          envFrom:
            - secretRef: { name: keycloak-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: quarkus      # seeded by the initContainer; the boot build rewrites it
              mountPath: /opt/keycloak/lib/quarkus
            - name: kc-data
              mountPath: /opt/keycloak/data
            {{- if .Values.realmImport.enabled }}
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
            {{- if .Values.smtp.enabled }}
            - name: vault
              mountPath: /opt/keycloak/vault
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}      # readOnlyRootFilesystem still needs somewhere writable
        - name: quarkus
          emptyDir: {}
        - name: kc-data
          emptyDir: {}
        {{- if .Values.realmImport.enabled }}
        - name: realm
          configMap: { name: {{ .Values.realmImport.existingConfigMap }} }
        {{- end }}
        {{- if .Values.smtp.enabled }}
        - name: vault
          secret:
            secretName: keycloak-vault
            # the file vault looks for <realm>_<secretname>
            items:
              - { key: smtp-password, path: "{{ .Values.realm }}_smtp-password" }
        {{- end }}
