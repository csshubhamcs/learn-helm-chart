{{- if .Values.smtp.enabled }}
{{- /*
Keycloak's file vault reads a secret from a FILE named <realm>_<secretname>, which
is exactly the shape a mounted Kubernetes Secret has. So the Gmail App Password
goes: AWS Secrets Manager -> ESO -> this Secret -> a file -> ${vault.smtp-password}
in the realm config. It is never in git, never in a values file, and never in an
environment variable.

Deliberately separate from keycloak-secrets: that one is consumed with envFrom, and
"smtp-password" is not a legal environment variable name.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-vault
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecret.storeName }}, kind: ClusterSecretStore }
  target: { name: keycloak-vault, creationPolicy: Owner }
  data:
    - secretKey: smtp-password
      remoteRef:
        key: {{ required "smtp.passwordRemoteKey is required when smtp.enabled" .Values.smtp.passwordRemoteKey | quote }}
{{- end }}
