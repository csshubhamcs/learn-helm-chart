# The ONE file that differs between environments — and the only place any
# credential is named. Every ExternalSecret in every chart is identical across
# environments; they just point at this store by name.
#
# On real AWS this whole `auth` block is deleted and replaced by IRSA
# (a ServiceAccount annotated with an IAM role). Nothing else changes.
#
# NOTE: the endpoint is NOT set here. ESO's AWS provider has no endpoint field in
# its CRD; floci is reached by AWS_SECRETSMANAGER_ENDPOINT on the ESO controller
# Deployment (see the install command in the guide). That env var is process-wide,
# so one ESO install cannot mix floci and real AWS stores.
apiVersion: v1
kind: Secret
metadata:
  name: floci-creds-staging
  namespace: external-secrets
type: Opaque
stringData:
  access-key: test              # floci accepts any non-empty credentials
  secret-access-key: test
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # deliberately no `role:` — omitting it keeps STS out of the call path
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-creds-staging
            namespace: external-secrets    # required for a ClusterSecretStore
            key: access-key
          secretAccessKeySecretRef:
            name: floci-creds-staging
            namespace: external-secrets
            key: secret-access-key
